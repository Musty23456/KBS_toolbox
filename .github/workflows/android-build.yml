name: Android Build

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:
    inputs:
      apiBaseUrl:
        description: "Backend API base URL to bake into this build"
        required: false
        default: "https://api.example.com"

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted ubuntu-latest runners ship with the Android SDK
      # already preinstalled (ANDROID_HOME/cmdline-tools/platform-tools).
      # The third-party android-actions/setup-android@v3 action was
      # dropped here after it got stuck on an interactive SDK license
      # prompt when it tried to redownload a newer cmdline-tools version
      # ("Review licenses that have not been accepted (y/N)?" — with no
      # stdin available in CI, that hangs/fails). Accepting licenses and
      # installing the exact packages this project needs directly is more
      # reliable than depending on that action's redownload logic.
      - name: Accept Android SDK licenses and install required packages
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      # Repository does not commit gradle/wrapper/gradle-wrapper.jar (a
      # binary), so CI installs Gradle directly rather than using ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: Run unit tests
        working-directory: android
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: android
        run: >
          gradle assembleDebug --stacktrace
          -PapiBaseUrl=${{ github.event.inputs.apiBaseUrl || 'http://10.0.2.2:8000' }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kbs-toolbox-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
